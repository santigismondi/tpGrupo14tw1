<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(
        ~{::content},
        ~{::header_left},
        ~{::header_center},
        ~{},
        ~{dashboard/fragments/notificacion::alertaVencimiento},
        ~{::scripts}
      )}">

<head>
    <title>Dashboard Global</title>
</head>


<!-- HEADER CENTER -->
<div th:fragment="header_center">
    <h1 class="text-puesto-header-text font-bold uppercase tracking-widest">
        Panel de Control Global
    </h1>
</div>

<!-- HEADER LEFT -->
<div th:fragment="header_left">
    <a th:href="@{/home}"
        class="hidden md:flex items-center px-4 py-2 bg-black/10 hover:bg-black/20 rounded-lg border border-white/20 transition text-xs font-bold uppercase tracking-wider">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
</div>

<!-- CONTENT -->

<!-- MODAL DE IMPORTACIÓN -->

<div th:fragment="content" class="min-h-screen font-sans">

    <div th:insert="~{dashboard/fragments/modalImportacion :: modalImportacion}"></div>
    <div th:insert="~{dashboard/fragments/modalRenovacion :: modalRenovacion}"></div>
    <!-- LOOP CATEGORIAS -->
    <div th:each="categoria : ${categorias}">

        <!-- SECCION -->
        <section th:classappend="${categoria.tema}"
            class="px-8 py-8 bg-[var(--bg-app)] transition-colors duration-300 border-b border-black/10">

            <!-- TOP -->
            <div class="flex items-center justify-between mb-6">

                <!-- IZQUIERDA -->
                <div class="flex items-center gap-4">

                    <h2 class="text-4xl md:text-5xl font-black uppercase italic tracking-tight text-black"
                        th:text="${categoria.nombre}">
                        Categoria
                    </h2>

                    <!-- ACTIVOS -->
                    <div class="px-4 py-1 rounded-full text-white text-xs font-black uppercase"
                        style="background-color: var(--bg-header); color: var(--text-header);">

                        <span th:text="${#lists.size(timersPorCategoria[categoria.id])}">
                            0
                        </span>

                        activos
                    </div>

                </div>

                <!-- DERECHA -->
                <span class="hidden md:block text-xs uppercase tracking-[0.4em] text-gray-400 font-bold">

                    Área de control:
                    <span th:text="${categoria.nombre}"></span>

                </span>

            </div>

            <!-- LINEA -->
            <div class="h-1 mb-8" style="background-color: var(--bg-header);">
            </div>

            <!-- VACIO -->
            <div th:if="${#lists.isEmpty(timersPorCategoria[categoria.id])}"
                class="border-2 border-dashed border-gray-300 rounded-3xl h-48 flex items-center justify-center">

                <p class="text-gray-400 uppercase tracking-widest font-black italic text-center">
                    No hay producciones activas en esta área
                </p>

            </div>

            <!-- GRID -->
            <div th:if="${!#lists.isEmpty(timersPorCategoria[categoria.id])}"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">

                <!-- CARD -->
                <div th:each="timer : ${timersPorCategoria[categoria.id]}"
                     th:id="'timer-' + ${timer.id}"
                     class="timer bg-white rounded-3xl shadow-xl border-b-[8px] border-puesto-header flex flex-col transform transition-all active:scale-95 min-h-[400px]"
                     th:data-vencimiento="${timer.fechaVencimiento}"
                     th:data-elaboracion="${timer.fechaCreacion}">

                    <div class="px-6 pt-6 pb-2 flex-none">
                        <div class="flex justify-between items-center gap-4">
                            <h2 class="text-2xl font-black text-gray-800 leading-tight uppercase line-clamp-2"
                                th:id="'nombre-' + ${timer.id}"
                                th:text="${timer.nombre}">Nombre Producto</h2>

                            <span class="bg-gray-100 text-gray-600 text-xs font-black uppercase px-3 py-1.5 rounded-full whitespace-nowrap shrink-0"
                                  th:id="'ubicacion-' + ${timer.id}"
                                  th:text="${timer.ubicacion ?: 'General'}">Ubicación</span>
                        </div>

                        <div class="mt-4 flex justify-between items-center w-full border-b border-gray-100 pb-4">
                            <div class="flex items-center gap-1.5 text-slate-500">
                                <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 24 24">
                                    <path fill-rule="evenodd" d="M12 12a5 5 0 100-10 5 5 0 000 10zm-7 8a7 7 0 1114 0H5z" clip-rule="evenodd"/>
                                </svg>
                                <span class="text-sm font-bold uppercase tracking-wider truncate max-w-[120px]"
                                      th:id="'usuario-' + ${timer.id}"
                                      th:text="${timer.usuario ?: 'General'}">Usuario</span>
                            </div>

                            <span class="timer-cantidad text-sm font-black text-puesto-header uppercase tracking-widest shrink-0"
                                  th:text="'Cantidad: ' + ${timer.cantidad}"></span>
                        </div>
                    </div>

                    <div class="px-6 py-4 flex-grow flex flex-col items-center justify-center">
                        <div class="w-full bg-gray-50 border-2 border-gray-100 rounded-3xl py-8 px-2 flex flex-col items-center justify-center shadow-inner">
                <span th:id="'display-' + ${timer.id}"
                      class="timer-display text-1xl min-[400px]:text-6xl sm:text-7xl tracking-tighter font-mono font-black text-gray-800 tabular-nums leading-none">
                    00:00:00
                </span>
                            <div class="text-xs font-black text-gray-400 uppercase tracking-widest mt-3">
                                Tiempo restante
                            </div>
                        </div>
                    </div>

                    <div class="px-6 py-4 grid grid-cols-2 gap-4 flex-none border-t border-gray-50">
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-0.5">Elaboración</span>
                            <span th:id="'elab-' + ${timer.id}"
                                  class="text-gray-800 font-black text-base sm:text-lg"
                                  th:text="${timer.fechaCreacion}">12:00</span>
                        </div>
                        <div class="flex flex-col text-right">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-0.5">Vencimiento</span>
                            <span th:id="'vence-' + ${timer.id}"
                                  class="text-puesto-header font-black text-base sm:text-lg"
                                  th:text="${timer.fechaVencimiento}">14:00</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 h-20 border-t border-gray-100 flex-none">

                        <button type="button"
                                th:data-action="delete"
                                th:data-timer-id="${timer.id}"
                                th:data-category-id="${categoria.id}"
                                class="btn-eliminar bg-red-50 hover:bg-red-100 text-red-600 flex flex-col items-center justify-center transition-colors active:bg-red-200 group border-r border-gray-100/50">
                            <svg class="w-6 h-6 mb-1 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                            <span class="text-[10px] font-black uppercase tracking-wider">Eliminar</span>
                        </button>

                        <button type="button"
                                th:data-action="import"
                                th:data-timer-id="${timer.id}"
                                th:data-product-name="${timer.nombre}"
                                th:data-location="${timer.ubicacion ?: 'General'}"
                                th:data-cantidad="${timer.cantidad}"
                                class="btn-importar bg-slate-50 hover:bg-slate-100 text-slate-600 flex flex-col items-center justify-center transition-colors active:bg-slate-200 group border-r border-gray-100/50">
                            <svg class="w-6 h-6 mb-1 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                            <span class="text-[10px] font-black uppercase tracking-wider">Importar</span>
                        </button>

                        <button type="button"
                                th:data-action="renew"
                                th:data-timer-id="${timer.id}"
                                th:data-category-id="${categoria.id}"
                                th:data-cantidad="${timer.cantidad}"
                                class="btn-renovar bg-puesto-btn text-puesto-btn-text flex flex-col items-center justify-center transition-all hover:brightness-105 active:brightness-95 group">
                            <svg class="w-6 h-6 mb-1 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            <span class="text-[10px] font-black uppercase tracking-wider">Renovar</span>
                        </button>

                    </div>
                </div>

                </div>

            </div>

        </section>

    </div>

</div>

<!-- SCRIPTS -->
<div th:fragment="scripts">
    <script type="module" th:src="@{/resources/core/js/actualizarTemporizadores.js}" defer></script>
    <script type="module" th:src="@{/resources/core/js/DashboardFunciones.js}" defer></script>
</div>

</html>
